<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback - Ven Visitacion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 90px 20px;
      background: linear-gradient(135deg, #000, #1a0000);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.25);
      margin-bottom: 60px;
      animation: fadeIn 1s ease;
    }

    .hero h1 {
      color: #ff3333;
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ddd;
      font-size: 1.1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Title */
    h1.title {
      border-left: 5px solid #ff1a1a;
      padding-left: 15px;
      font-weight: 700;
      color: #ff1a1a;
      margin-bottom: 30px;
      text-transform: none;
    }

    /* Feedback Card */
    .feedback-card {
      background: #141414;
      border: 1px solid #330000;
      border-radius: 15px;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(255, 26, 26, 0.15);
      transition: 0.3s ease;
      animation: fadeUp 1s ease;
    }

    .feedback-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(255, 26, 26, 0.3);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-control {
      background-color: #0d0d0d !important;
      border: 1px solid #333 !important;
      color: #fff !important;
    }

    .form-control:focus {
      border-color: #ff1a1a !important;
      box-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
    }

    .btn-danger {
      background-color: #ff1a1a;
      border: none;
      border-radius: 25px;
      padding: 10px 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-danger:hover {
      background-color: #b30000;
      transform: scale(1.05);
    }

    /* Footer */
    footer {
      background: #1a0000;
      color: #ccc;
      padding: 30px 0;
      text-align: center;
      border-top: 1px solid #330000;
      margin-top: 50px;
    }

    footer a {
      color: #ff3333;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>
  <div id="header"></div>

  <!-- Hero Section -->
  <section class="hero container mt-5" data-aos="fade-down">
    <h1>Feedback</h1>
    <p>Share your thoughts and suggestions — your feedback helps me grow and improve!</p>
  </section>

  <!-- Feedback Section -->
  <section class="container py-5" data-aos="fade-up">
    <div class="feedback-card">
      <form>
        <div class="mb-3">
          <label for="name" class="form-label text-light">Name</label>
          <input type="text" id="name" class="form-control" placeholder="Your Name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label text-light">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Your Email">
        </div>
        <div class="mb-3">
          <label for="message" class="form-label text-light">Message</label>
          <textarea id="message" class="form-control" rows="4" placeholder="Your feedback..."></textarea>
        </div>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-danger"><i class="fas fa-paper-plane me-2"></i>Submit</button>
        </div>
      </form>
    </div>
  </section>

  <div id="footer"></div>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    // Load header
    fetch("header.html").then(res => res.text()).then(data => {
      document.getElementById("header").innerHTML = data;
      const current = location.pathname.split("/").pop();
      document.querySelectorAll(".nav-link").forEach(link => {
        if (link.getAttribute("href").includes(current)) link.classList.add("active");
      });
    });

    // Load footer
    fetch("footer.html").then(res => res.text()).then(data => {
      document.getElementById("footer").innerHTML = data;
    });
  </script>
</body>
</html>
